<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zeetex Trade</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#1c1e2b;--pn:#282b3b;--ln:#343850;--tx:#e8ebf4;--mu:#8f95ad;--up:#0faf59;--dn:#ef5d4e;--ac:#2b99ff}
html,body{height:100%}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
#app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
header,.bar{display:flex;align-items:center;gap:10px;padding:8px 12px}
header{background:#14161f}.logo{font-weight:800}.logo b{color:var(--ac)}.sp{flex:1}
.acc{background:var(--pn);padding:6px 12px;border-radius:8px;font-size:12px;color:var(--mu)}.acc b{display:block;font-size:15px;color:var(--tx)}.acc i{color:#ff8a00;font-style:normal;font-weight:700;margin-right:6px}
.ib{background:var(--pn);border:0;color:var(--tx);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:13px}
.bar{overflow-x:auto;scrollbar-width:none}.pairbtn{display:flex;gap:8px;align-items:center;background:var(--pn);border:0;color:var(--tx);padding:9px 14px;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}.pairbtn em{color:#ff8a00;font-style:normal}
.tfs{display:flex;gap:4px}.tfs button{background:none;border:1px solid var(--ln);color:var(--mu);padding:7px 11px;border-radius:6px;cursor:pointer}.tfs .on{background:var(--ac);border-color:var(--ac);color:#fff}
.body{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.chart{position:relative;min-height:0}.chart canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#na{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;color:var(--mu);background:var(--bg);z-index:2}
.ttl{position:absolute;top:8px;left:12px;font-size:13px;color:var(--mu);pointer-events:none}
.panel{background:var(--pn);padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
.fld{border:1px solid var(--ln);border-radius:8px;padding:8px 10px;position:relative}.fld small{position:absolute;top:-8px;left:8px;background:var(--pn);padding:0 4px;color:var(--mu);font-size:11px}
.fld div{display:flex;align-items:center;gap:8px}.fld input{flex:1;min-width:0;background:none;border:0;color:var(--tx);font-size:16px;text-align:center;outline:0}
.fld button{width:28px;height:28px;border-radius:50%;border:0;background:var(--ln);color:var(--tx);cursor:pointer;font-size:16px}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}.row b{color:var(--up)}
.go{display:grid;grid-template-columns:1fr 1fr;gap:10px}.go button{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:8px;padding:14px;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.go .u{background:var(--up)}.go .d{background:var(--dn)}.go span{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:14px}.go button:active{transform:scale(.97)}
#tr h5{color:var(--mu);font-size:12px;margin:4px 0 6px}.t{display:grid;grid-template-columns:1fr auto;padding:9px 0;border-top:1px solid var(--ln);font-size:13px}.t small{color:var(--mu)}.t .r{text-align:right;font-weight:700}.w{color:var(--up)}.l{color:var(--dn)}.n{color:var(--mu)}
#modal{position:fixed;inset:0;background:rgba(10,11,18,.8);display:none;z-index:20;padding:12px}#modal.on{display:block}
#modal .in{max-width:520px;margin:0 auto;background:var(--bg);border-radius:12px;max-height:100%;overflow:auto;padding:14px}
.pi{display:flex;justify-content:space-between;padding:12px 8px;border-bottom:1px solid var(--ln);cursor:pointer}.pi:hover{background:var(--pn)}.pi em{color:#ff8a00;font-style:normal}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:8px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
#tb{display:none}
@media(max-width:899px){
 .body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 .panel{overflow:visible;padding:10px 12px;gap:10px}.fldrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 #tr{position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;background:var(--pn);padding:14px;border-radius:14px 14px 0 0;display:none;z-index:15;box-shadow:0 -10px 40px #0008}#tr.on{display:block}
 #tb{display:block}
}
@media(min-width:900px){.fldrow{display:flex;flex-direction:column;gap:14px}}
</style></head>
<body><div id="app">
<header><div class="logo">ZEE<b>TEX</b></div><div class="sp"></div>
<button class="ib" id="tb">Trades <span id="tn">0</span></button>
<div class="acc"><i>DEMO</i>Balance<b id="bal">$0.00</b></div><button class="ib" id="out">Logout</button></header>
<div class="bar"><button class="pairbtn" id="pb">—</button><div class="tfs" id="tfs"></div></div>
<div class="body">
 <div class="chart"><canvas id="cv"></canvas><div class="ttl" id="ttl"></div><h2 id="na"></h2></div>
 <aside class="panel">
  <div class="row" style="font-size:15px;color:var(--tx);font-weight:700"><span id="pn">—</span><span id="pp" style="color:#ff8a00">85%</span></div>
  <div class="fldrow">
   <div class="fld"><small>Timer</small><div><button id="dm">−</button><input id="dv" readonly><button id="dp">+</button></div></div>
   <div class="fld"><small>Investment</small><div><button id="am">−</button><input id="av" type="number" value="10"><button id="ap">+</button></div></div>
  </div>
  <div class="row"><span>Payout</span><b id="po">$0.00</b></div>
  <div class="go"><button class="u" id="up">UP <span>↑</span></button><button class="d" id="dn">DOWN <span>↓</span></button></div>
  <div id="tr"><h5>OPEN TRADES</h5><div id="ol"></div><h5>CLOSED</h5><div id="cl"></div></div>
 </aside>
</div></div>
<div id="modal"><div class="in"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><b>Select trade pair</b><button class="ib" id="mc">✕</button></div><div id="pl"></div></div></div>
<div id="toast"></div>
<script src="chart.js"></script>
<script>
const API='https://zeetex-chart.vercel.app',S=JSON.parse(localStorage.getItem('zt_session')||'null');if(!S)location.href='sign-in.html';
const $=id=>document.getElementById(id),DUR=[5,15,30,60,120,300],TF=['1m','5m','15m'],TFS={'1m':60,'5m':300,'15m':900};
let pair='',pairs=[],tf='1m',di=1,ctl=null,skew=0,payout=85,bal=0,trades=[],seq=0;
const ch=new CandleChart($('cv')),money=v=>'$'+Number(v).toFixed(2),fmtT=s=>'00:'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const j=(p,o)=>fetch(API+p,o).then(r=>r.json());
const post=(p,b)=>j(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const logout=()=>{localStorage.removeItem('zt_session');location.href='sign-in.html'};
function toast(m,c){const t=$('toast');t.textContent=m;t.style.background=c;t.style.opacity=1;clearTimeout(t.h);t.h=setTimeout(()=>t.style.opacity=0,2600)}
const nm=p=>p.replace('-OTC','').replace(/^(...)(...)$/,'$1/$2')+' (OTC)';
function na(msg){$('na').style.display=msg?'flex':'none';$('na').textContent=msg||''}
async function loadPairs(){const r=await j('/api/live');pairs=r.pairs||[];$('pl').innerHTML=pairs.map(p=>`<div class="pi" data-p="${p.name}"><b>${nm(p.name)}</b><span>Profit <em>${p.payout}%</em></span></div>`).join('')||'<p style="padding:14px;color:var(--mu)">No pairs available.</p>'}
async function select(p){
 pair=p;const my=++seq;$('pb').innerHTML=`${nm(p)} <em></em> ▾`;$('pn').textContent=nm(p);ch.marks=[];na('');
 try{
  const r=await j(`/api/chart/${p}?id=${S.id}&tf=${tf}`);if(my!==seq)return;
  if(['USER_NOT_FOUND','USER_BLOCKED'].includes(r.code))return logout();
  if(r.status===false||!r.candle)return na(`${r.pair||p} chart is not available at the moment`);
  bal=r.stats.balance;$('bal').textContent=money(bal);
  await poll();ch.setData(r.candle,priceAt(ctl,Date.now()+skew),TFS[tf],decOf(ctl.price));renderMarks();
 }catch(e){na(`${p} chart is not available at the moment`)}
 upd()}
async function poll(){try{const r=await j('/api/live?pair='+pair);if(r.status){ctl=r.control;payout=r.payout;skew=r.serverTime-Date.now();ch.skew=skew;$('pp').textContent=payout+'%'}}catch(e){}}
setInterval(()=>{if(pair)poll()},2500);
setInterval(()=>{if(ctl&&ch.C.length){const p=priceAt(ctl,Date.now()+skew);ch.tick(p,Date.now()+skew);$('ttl').textContent=nm(pair)+'  '+p.toFixed(ch.dec)}},400);
function upd(){const a=+$('av').value||0;$('dv').value=fmtT(DUR[di]);$('po').textContent=money(a*payout/100);$('pp').textContent=payout+'%'}
$('dm').onclick=()=>{di=Math.max(0,di-1);upd()};$('dp').onclick=()=>{di=Math.min(DUR.length-1,di+1);upd()};
$('am').onclick=()=>{$('av').value=Math.max(1,(+$('av').value||1)-5);upd()};$('ap').onclick=()=>{$('av').value=(+$('av').value||0)+5;upd()};$('av').oninput=upd;
function renderMarks(){ch.marks=trades.filter(t=>t.status==='open'&&t.pair===pair).map(t=>({price:t.entryPrice,dir:t.direction,amt:t.amount,exp:t.expiryTime}))}
async function trade(d){
 if(!ctl||$('na').style.display==='flex')return toast('Chart not available','#ef5d4e');
 const r=await post('/api/trade',{userId:S.id,pair,direction:d,amount:+$('av').value,duration:DUR[di]});
 if(r.code==='USER_NOT_FOUND'||r.code==='USER_BLOCKED')return logout();
 if(!r.status)return toast(r.message||r.code,'#ef5d4e');
 trades.unshift(r.trade);bal=r.newBalance;$('bal').textContent=money(bal);renderMarks();list();toast((d==='buy'?'UP':'DOWN')+' trade placed','#2b99ff')}
$('up').onclick=()=>trade('buy');$('dn').onclick=()=>trade('sell');
async function settle(t){if(t.busy)return;t.busy=1;const r=await post('/api/settle',{userId:S.id,tradeId:t.id});if(r.status&&r.trade.status==='closed'){Object.assign(t,r.trade);bal=r.newBalance;$('bal').textContent=money(bal);renderMarks();list();
 toast(t.result==='win'?'WIN +'+money(t.pnl):t.result==='loss'?'LOSS −'+money(t.amount):'Tie — refunded',t.result==='win'?'#0faf59':t.result==='loss'?'#ef5d4e':'#686f86')}else t.busy=0}
setInterval(()=>trades.forEach(t=>{if(t.status==='open'&&Date.now()+skew>=t.expiryTime+300)settle(t)}),500);
function row(t){const left=Math.max(0,Math.ceil((t.expiryTime-Date.now()-skew)/1000)),o=t.status==='open',c=t.result==='win'?'w':t.result==='loss'?'l':'n';
 return `<div class="t"><div><b>${nm(t.pair)}</b> <span class="${t.direction==='buy'?'w':'l'}">${t.direction==='buy'?'↑ UP':'↓ DOWN'}</span><br><small>${money(t.amount)} · ${t.entryPrice.toFixed(ch.dec)}</small></div><div class="r ${o?'':c}">${o?`<span data-e="${t.expiryTime}">${fmtT(left)}</span>`:(t.result==='tie'?'Tie':(t.pnl>0?'+':'−')+money(Math.abs(t.pnl)))}</div></div>`}
function list(){const o=trades.filter(t=>t.status==='open'),c=trades.filter(t=>t.status!=='open').slice(0,30);$('ol').innerHTML=o.map(row).join('')||'<small class="n">No open trades</small>';$('cl').innerHTML=c.map(row).join('')||'<small class="n">No closed trades</small>';$('tn').textContent=o.length}
setInterval(()=>document.querySelectorAll('[data-e]').forEach(e=>e.textContent=fmtT(Math.max(0,Math.ceil((+e.dataset.e-Date.now()-skew)/1000)))),500);
$('tfs').innerHTML=TF.map(t=>`<button data-t="${t}" class="${t===tf?'on':''}">${t}</button>`).join('');
$('tfs').onclick=e=>{if(e.target.dataset.t){tf=e.target.dataset.t;[...$('tfs').children].forEach(b=>b.classList.toggle('on',b.dataset.t===tf));select(pair)}};
$('pb').onclick=()=>$('modal').classList.add('on');$('mc').onclick=()=>$('modal').classList.remove('on');
$('pl').onclick=e=>{const p=e.target.closest('.pi');if(p){$('modal').classList.remove('on');select(p.dataset.p)}};
$('tb').onclick=()=>$('tr').classList.toggle('on');$('out').onclick=logout;
(async()=>{await loadPairs();upd();list();if(pairs[0])select((pairs.find(p=>p.name==='USDPKR-OTC')||pairs[0]).name);else na('No pairs available at the moment')})();
</script></body></html>
