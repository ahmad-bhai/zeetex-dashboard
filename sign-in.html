<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in</title><link rel="stylesheet" href="style.css"></head>
<body><div class="box">
<div class="logo">ZEE<b>TEX</b></div><div class="sub">Sign in to your demo account.</div>
<label>Email</label><input id="e" type="email" autocomplete="email">
<label>Password</label><input id="p" type="password" autocomplete="current-password">
<button id="go">Sign in</button><div class="err" id="err"></div>
<div class="alt">New here? <a href="sign-up.html">Create account</a></div></div>
<script>
const $=id=>document.getElementById(id);
const submit=()=>{
 const e=$('e').value.trim().toLowerCase(),users=JSON.parse(localStorage.getItem('zt_users')||'{}'),u=users[e];
 if(!u||u.pass!==$('p').value)return $('err').textContent='Wrong email or password.';
 localStorage.setItem('zt_session',JSON.stringify({email:e,name:u.name,id:u.id}));
 location.href='demo-trade.html';
};
$('go').onclick=submit;$('p').onkeydown=ev=>ev.key==='Enter'&&submit();
</script></body></html>
