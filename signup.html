<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeetex - Sign Up</title>
<style>
  body { background: #0d1117; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .box { background: #161b22; padding: 30px; border-radius: 10px; width: 100%; max-width: 400px; border: 1px solid #30363d; }
  h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; }
  input { width: 100%; padding: 12px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #238636; border: none; color: #fff; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .link { text-align: center; margin-top: 15px; font-size: 14px; }
  .link a { color: #58a6ff; text-decoration: none; }
  .error { color: #f85149; font-size: 13px; text-align: center; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="box">
  <h2>Create Account</h2>
  <input type="text" id="name" placeholder="Full Name" />
  <input type="password" id="password" placeholder="Password" />
  <button onclick="signup()">Sign Up</button>
  <div class="error" id="errorMsg">Registration failed</div>
  <div class="link">Already have an account? <a href="/">Sign In</a></div>
</div>

<script>
  async function signup() {
    const name = document.getElementById('name').value;
    const pass = document.getElementById('password').value;
    const btn = event.target;
    
    if (!name || !pass) return alert("Fill all fields!");
    
    btn.innerText = "Creating...";
    try {
      // Random ID generate ho raha hai (Yahan hum 6 digit ka bana rahe hain)
      const newId = Math.floor(100000 + Math.random() * 900000).toString();

      const res = await fetch('https://zeetex-chart.vercel.app/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: newId, name: name, password: pass })
      });
      const data = await res.json();
      
      if (data.status) {
        alert("Account Created! Your User ID is: " + newId + "\nPlease Login.");
        window.location.href = '/';
      } else {
        document.getElementById('errorMsg').innerText = data.message;
        document.getElementById('errorMsg').style.display = 'block';
      }
    } catch (e) {
      alert("Connection Error!");
    }
    btn.innerText = "Sign Up";
  }
</script>
</body>
</html>
